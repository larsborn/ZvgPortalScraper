name: Build and publish Docker images

# Only build/publish on version tags (e.g. v1.2.3). Cut a release by pushing
# a matching tag: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zvgportalscraper
            dockerfile: Dockerfile
          - image: zvg2mariadb
            dockerfile: Dockerfile.zvg2mariadb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve owner (lowercase) for GHCR
        # GHCR requires lowercase image names, but ${{ github.repository_owner }}
        # preserves the original casing (e.g. larsborn vs Larsborn).
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # For a tag like `v1.2.3` this produces: `1.2.3`, `1.2`, `1`,
          # `latest`, plus a `sha-<short>` tag for traceability.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
